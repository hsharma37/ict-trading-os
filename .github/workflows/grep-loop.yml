name: PR GrepLoop

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  grep-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run scoped grep-loop
        run: bash scripts/grep-loop.sh "origin/${{ github.base_ref }}"
