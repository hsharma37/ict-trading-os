; Process tree for the containerized MT5 bridge. Order matters via priority:
; display → VNC/noVNC (browser login) → terminal → bridge.

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x900x24
priority=10
autorestart=true

[program:x11vnc]
; Bound to localhost inside the container; reach it via the noVNC websocket
; (port 6080) which compose maps to 127.0.0.1 on the host only.
command=/usr/bin/x11vnc -display :99 -localhost -forever -shared -nopw
priority=20
autorestart=true

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
priority=30
autorestart=true

[program:mt5terminal]
command=/usr/bin/wine "/root/.wine/drive_c/Program Files/MetaTrader 5/terminal64.exe"
priority=40
autorestart=true
startretries=10
environment=DISPLAY=":99",WINEDEBUG="-all"

[program:bridge]
; Repo's mt5-bridge/ is bind-mounted at /app/mt5-bridge (see compose) —
; `git pull` on the host updates it; restart this program to apply.
command=/usr/bin/wine "/root/.wine/drive_c/Program Files/Python312/python.exe" mt5_bridge.py
directory=/app/mt5-bridge
priority=50
autorestart=true
startretries=10
environment=DISPLAY=":99",WINEDEBUG="-all"
