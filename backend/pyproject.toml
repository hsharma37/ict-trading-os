[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ict-trading-os"
version = "1.0.0"
description = "ICT Trading OS — FastAPI backend for trading plans, execution, risk, journal, and analytics"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Harshit Sharma", email = "hsharma.works247@gmail.com"}
]
keywords = ["trading", "fastapi", "sqlmodel", "ict", "risk-management"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "factory-boy>=3.3.0",
]
